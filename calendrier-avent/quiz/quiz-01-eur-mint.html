<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendrier de l'Avent – Quiz n°1 : l'EUR MINT</title>
<style>
  :root {
    --bg: #0f2a3d;
    --card: #ffffff;
    --ink: #1c2733;
    --muted: #5d6b78;
    --accent: #c0392b;
    --accent-dark: #962d22;
    --gold: #e0a526;
    --ok: #2e8b57;
    --ok-bg: #e8f5ee;
    --ko: #c0392b;
    --ko-bg: #fbeceb;
    --line: #e3e7eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: radial-gradient(circle at 20% 10%, #1d4562 0%, var(--bg) 60%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .card {
    background: var(--card);
    width: 100%;
    max-width: 640px;
    border-radius: 18px;
    box-shadow: 0 20px 50px rgba(0,0,0,.35);
    overflow: hidden;
  }
  header {
    background: var(--accent);
    color: #fff;
    padding: 22px 28px 18px;
    position: relative;
  }
  header .day {
    position: absolute;
    right: 22px; top: 18px;
    width: 54px; height: 54px;
    border-radius: 50%;
    background: var(--gold);
    color: #fff;
    font-weight: 800;
    font-size: 26px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.15);
  }
  header small { display: block; padding-right: 70px; text-transform: uppercase; letter-spacing: .12em; opacity: .85; font-size: 12px; }
  header h1 { margin: 6px 0 0; font-size: 24px; line-height: 1.25; padding-right: 70px; }
  .progress { height: 6px; background: var(--line); }
  .progress > div { height: 100%; width: 0; background: var(--gold); transition: width .35s ease; }
  main { padding: 26px 28px 28px; }
  .count { color: var(--muted); font-size: 14px; margin-bottom: 8px; }
  h2 { font-size: 20px; margin: 0 0 18px; line-height: 1.35; }
  .options { display: grid; gap: 10px; }
  .opt {
    text-align: left;
    font: inherit;
    font-size: 16px;
    padding: 14px 16px;
    border: 2px solid var(--line);
    border-radius: 12px;
    background: #fff;
    cursor: pointer;
    transition: border-color .15s, background .15s, transform .05s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: #fff7f6; }
  .opt:active:not(:disabled) { transform: scale(.99); }
  .opt:disabled { cursor: default; }
  .opt.correct { border-color: var(--ok); background: var(--ok-bg); }
  .opt.wrong { border-color: var(--ko); background: var(--ko-bg); }
  .feedback {
    margin-top: 18px;
    padding: 14px 16px;
    border-radius: 12px;
    background: #f5f7f9;
    font-size: 15px;
    line-height: 1.5;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .feedback.good strong { color: var(--ok); }
  .feedback.bad strong { color: var(--ko); }
  .feedback a { color: var(--accent-dark); }
  .actions { margin-top: 20px; display: flex; justify-content: flex-end; }
  .btn {
    font: inherit;
    font-weight: 600;
    padding: 12px 22px;
    border: none;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  .btn:hover { background: var(--accent-dark); }
  .btn[hidden] { display: none; }
  .result { text-align: center; }
  .result .score { font-size: 56px; font-weight: 800; color: var(--accent); margin: 8px 0; }
  .result p { color: var(--muted); line-height: 1.5; }
  .result .actions { justify-content: center; gap: 10px; flex-wrap: wrap; }
  .btn.secondary { background: #fff; color: var(--accent); border: 2px solid var(--accent); }
  .btn.secondary:hover { background: #fff7f6; }
  footer { padding: 0 28px 18px; font-size: 12px; color: var(--muted); }
  footer a { color: var(--muted); }
  .key {
    margin-top: 12px; padding: 12px 14px; border-radius: 10px; text-align: left; line-height: 1.5;
    background: #fff8e6; border: 2px dashed var(--gold); color: var(--ink); font-size: 15px;
  }
  .key b.letter { font-size: 22px; color: var(--accent); letter-spacing: .05em; }
</style>
<script>
  // Statistiques GoatCounter (sans cookies) : uniquement à partir du 1er décembre 2026, 0 h (heure de Paris).
  // Ajoutez ?nostats à l'adresse pour ne pas compter vos propres visites.
  window.goatcounter = { no_onload: true };
  (function () {
    var q = new URLSearchParams(location.search);
    var off = q.has("nostats") || q.has("apercu") || location.hash === "#apercu" || Date.now() < Date.parse("2026-11-30T23:00:00Z");
    window.stat = function (path, title, event) {
      if (off) return;
      var tries = 0;
      var timer = setInterval(function () {
        if (window.goatcounter && window.goatcounter.count) {
          clearInterval(timer);
          try { window.goatcounter.count({ path: path, title: title, event: event !== false }); } catch (e) {}
        } else if (++tries > 50) clearInterval(timer);
      }, 200);
    };
  })();
</script>
<script data-goatcounter="https://chrislab.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<div class="card">
  <header>
    <small>Calendrier de l'Avent des Maths à Toulouse</small>
    <h1>Quiz : que savez-vous de l'EUR MINT ?</h1>
    <div class="day" aria-label="Case numéro 1">1</div>
  </header>
  <div class="progress"><div id="bar"></div></div>
  <main id="app"></main>
  <footer>Sources : <a href="https://mint.math.univ-toulouse.fr/fr/" target="_blank" rel="noopener">site de l'EUR MINT</a> (novembre 2026)</footer>
</div>

<script>
const QUESTIONS = [
  {
    q: "Que signifie l'acronyme MINT ?",
    options: [
      "Mathématiques et INteractions à Toulouse",
      "Modélisation, Informatique et Nouvelles Technologies",
      "Master International de Toulouse",
      "Mathématiques, Ingénierie et Numérique de Toulouse"
    ],
    answer: 0,
    explain: "MINT, c'est « Mathématiques et INteractions à Toulouse » : une graduate school (master + doctorat) consacrée aux mathématiques et à leurs interactions avec les autres sciences, adossée à l'Institut de Mathématiques de Toulouse.",
    link: "https://mint.math.univ-toulouse.fr/fr/qui-sommes-nous-and-contact/"
  },
  {
    q: "Combien de masterclasses l'EUR MINT a-t-elle organisées en 2026 ?",
    options: ["7", "9", "12", "15"],
    answer: 2,
    explain: "12 masterclasses en 2026, de janvier (Dan Popovici, théorème de plongement de Kodaira) à novembre (Xavier Lamy, géométrie des cristaux liquides). C'est plus qu'en 2025, qui comptait 7 sessions.",
    link: "https://mint.math.univ-toulouse.fr/fr/summer-school-and-masterclasses/masterclass/"
  },
  {
    q: "Quel est le montant mensuel d'une bourse MINT en M2 ?",
    options: ["800 € par mois", "1 000 € par mois", "1 200 € par mois", "1 500 € par mois"],
    answer: 2,
    explain: "La bourse de M2 est de 1 200 € net par mois pendant 10 mois (celle de M1 : 1 000 €). Les bourses MINT accompagnent un parcours doctoral complet jusqu'à 5 ans : M1 + M2 + thèse.",
    link: "https://mint.math.univ-toulouse.fr/fr/programme/bourses-mint/"
  },
  {
    q: "Quel était le thème de l'école d'été MINT 2026 ?",
    options: [
      "Random matrices and free probability",
      "Particle systems and PDEs",
      "Facets of complex dynamics",
      "Control, Inverse Problems and Spectral Theory"
    ],
    answer: 1,
    explain: "En 2026, l'école d'été portait sur « Particle systems and PDEs ». Les autres thèmes sont ceux des éditions précédentes : matrices aléatoires (2024), dynamique complexe (2023), contrôle et problèmes inverses (2025).",
    link: "https://mint.math.univ-toulouse.fr/fr/summer-school-and-masterclasses/ecole/"
  },
  {
    q: "À qui s'adressent les bourses Choquet-Bruhat, lancées en 2025-2026 ?",
    options: [
      "Aux doctorantes et doctorants en mobilité internationale",
      "Aux étudiantes de L2 de mathématiques qui visent la L3 Enseignement et Recherche à Toulouse",
      "Aux lauréats des Olympiades de mathématiques",
      "Aux étudiants en reprise d'études"
    ],
    answer: 1,
    explain: "Jusqu'à quatre bourses Choquet-Bruhat de 6 000 € par an sont proposées à des étudiantes de L2 de mathématiques (à Toulouse ou ailleurs) souhaitant intégrer la L3 Mathématiques Enseignement et Recherche à Toulouse. Elles portent le nom d'Yvonne Choquet-Bruhat, première femme élue à l'Académie des sciences.",
    link: "https://mint.math.univ-toulouse.fr/fr/programme/bourses-mint/"
  }
];

const app = document.getElementById("app");
const bar = document.getElementById("bar");
let current = 0;
let score = 0;

function render() {
  const item = QUESTIONS[current];
  bar.style.width = (current / QUESTIONS.length * 100) + "%";
  app.innerHTML = `
    <div class="count">Question ${current + 1} / ${QUESTIONS.length}</div>
    <h2>${item.q}</h2>
    <div class="options">
      ${item.options.map((o, i) => `<button class="opt" data-i="${i}">${o}</button>`).join("")}
    </div>
    <div class="feedback" id="fb"></div>
    <div class="actions"><button class="btn" id="next" hidden>${current === QUESTIONS.length - 1 ? "Voir mon score" : "Question suivante →"}</button></div>
  `;
  app.querySelectorAll(".opt").forEach(btn => btn.addEventListener("click", () => choose(+btn.dataset.i)));
  document.getElementById("next").addEventListener("click", () => {
    current++;
    current < QUESTIONS.length ? render() : showResult();
  });
}

function choose(i) {
  const item = QUESTIONS[current];
  const buttons = app.querySelectorAll(".opt");
  buttons.forEach(b => b.disabled = true);
  buttons[item.answer].classList.add("correct");
  const good = i === item.answer;
  if (good) score++; else buttons[i].classList.add("wrong");
  const fb = document.getElementById("fb");
  fb.className = "feedback show " + (good ? "good" : "bad");
  fb.innerHTML = `<strong>${good ? "Bonne réponse !" : "Pas tout à fait…"}</strong>${item.explain} <a href="${item.link}" target="_blank" rel="noopener">En savoir plus</a>`;
  const next = document.getElementById("next");
  next.hidden = false;
  next.focus();
}

function showResult() {
  stat("fin-quiz-01", "Fin : quiz EUR MINT (case 1)");
  bar.style.width = "100%";
  const msgs = [
    "Il est temps d'aller faire un tour sur le site de l'EUR MINT !",
    "Un bon début : le site de l'EUR MINT vous en apprendra plus.",
    "Pas mal du tout !",
    "Très bien, vous connaissez l'EUR MINT.",
    "Excellent, presque un sans-faute !",
    "Sans-faute ! Vous êtes incollable sur l'EUR MINT."
  ];
  app.innerHTML = `
    <div class="result">
      <div class="count">Votre score</div>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <p>${msgs[score]}</p>
      <div class="key">🔑 <b>Énigme du 24 décembre</b> : votre lettre mystère est <b class="letter">T</b>. Notez-la bien ! Le 24 décembre, il faudra remettre dans l'ordre toutes les lettres récoltées dans le calendrier pour trouver le mot mystère.</div>
      <div class="actions">
        <button class="btn secondary" id="again">Recommencer</button>
        <a class="btn" href="https://mint.math.univ-toulouse.fr/fr/" target="_blank" rel="noopener" style="text-decoration:none">Découvrir l'EUR MINT</a>
      </div>
    </div>
  `;
  document.getElementById("again").addEventListener("click", () => { current = 0; score = 0; render(); });
}

render();
stat(location.pathname, document.title, false);
</script>
</body>
</html>
