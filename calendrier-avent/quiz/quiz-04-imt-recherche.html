<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendrier de l'Avent – Quiz n°4 : l'IMT, ses équipes et sa recherche</title>
<style>
  :root {
    --bg: #0f2a3d;
    --card: #ffffff;
    --ink: #1c2733;
    --muted: #5d6b78;
    --accent: #c0392b;
    --accent-dark: #962d22;
    --gold: #e0a526;
    --ok: #2e8b57;
    --ok-bg: #e8f5ee;
    --ko: #c0392b;
    --ko-bg: #fbeceb;
    --line: #e3e7eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: radial-gradient(circle at 20% 10%, #1d4562 0%, var(--bg) 60%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .card {
    background: var(--card);
    width: 100%;
    max-width: 640px;
    border-radius: 18px;
    box-shadow: 0 20px 50px rgba(0,0,0,.35);
    overflow: hidden;
  }
  header {
    background: var(--accent);
    color: #fff;
    padding: 22px 28px 18px;
    position: relative;
  }
  header .day {
    position: absolute;
    right: 22px; top: 18px;
    width: 54px; height: 54px;
    border-radius: 50%;
    background: var(--gold);
    color: #fff;
    font-weight: 800;
    font-size: 26px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.15);
  }
  header small { text-transform: uppercase; letter-spacing: .12em; opacity: .85; font-size: 12px; }
  header h1 { margin: 6px 0 0; font-size: 24px; line-height: 1.25; padding-right: 70px; }
  .progress { height: 6px; background: var(--line); }
  .progress > div { height: 100%; width: 0; background: var(--gold); transition: width .35s ease; }
  main { padding: 26px 28px 28px; }
  .count { color: var(--muted); font-size: 14px; margin-bottom: 8px; }
  h2 { font-size: 20px; margin: 0 0 18px; line-height: 1.35; }
  .options { display: grid; gap: 10px; }
  .opt {
    text-align: left;
    font: inherit;
    font-size: 16px;
    padding: 14px 16px;
    border: 2px solid var(--line);
    border-radius: 12px;
    background: #fff;
    cursor: pointer;
    transition: border-color .15s, background .15s, transform .05s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: #fff7f6; }
  .opt:active:not(:disabled) { transform: scale(.99); }
  .opt:disabled { cursor: default; }
  .opt.correct { border-color: var(--ok); background: var(--ok-bg); }
  .opt.wrong { border-color: var(--ko); background: var(--ko-bg); }
  .feedback {
    margin-top: 18px;
    padding: 14px 16px;
    border-radius: 12px;
    background: #f5f7f9;
    font-size: 15px;
    line-height: 1.5;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .feedback.good strong { color: var(--ok); }
  .feedback.bad strong { color: var(--ko); }
  .feedback a { color: var(--accent-dark); }
  .actions { margin-top: 20px; display: flex; justify-content: flex-end; }
  .btn {
    font: inherit;
    font-weight: 600;
    padding: 12px 22px;
    border: none;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  .btn:hover { background: var(--accent-dark); }
  .btn[hidden] { display: none; }
  .result { text-align: center; }
  .result .score { font-size: 56px; font-weight: 800; color: var(--accent); margin: 8px 0; }
  .result p { color: var(--muted); line-height: 1.5; }
  .result .actions { justify-content: center; gap: 10px; flex-wrap: wrap; }
  .btn.secondary { background: #fff; color: var(--accent); border: 2px solid var(--accent); }
  .btn.secondary:hover { background: #fff7f6; }
  footer { padding: 0 28px 18px; font-size: 12px; color: var(--muted); }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<div class="card">
  <header>
    <small>Calendrier de l'Avent des Maths à Toulouse</small>
    <h1>Quiz : l'IMT, ses équipes et sa recherche</h1>
    <div class="day" aria-label="Case numéro 15">15</div>
  </header>
  <div class="progress"><div id="bar"></div></div>
  <main id="app"></main>
  <footer>Sources : <a href="https://www.math.univ-toulouse.fr/fr/" target="_blank" rel="noopener">site de l'Institut de Mathématiques de Toulouse</a> (novembre 2026)</footer>
</div>

<script>
const QUESTIONS = [
  {
    "q": "Combien de personnels permanents compte l'Institut de Mathématiques de Toulouse, environ ?",
    "options": [
      "Environ 80",
      "Environ 150",
      "Environ 240",
      "Environ 500"
    ],
    "answer": 2,
    "explain": "L'IMT compte environ 240 personnels permanents (enseignants-chercheurs, chercheurs, ingénieurs, techniciens et administratifs), auxquels s'ajoutent environ 120 doctorantes et doctorants et une trentaine de post-doctorants.",
    "link": "https://www.math.univ-toulouse.fr/fr/institut/presentation/"
  },
  {
    "q": "L'IMT compte 6 équipes de recherche. Laquelle de ces équipes n'existe pas ?",
    "options": [
      "Probabilités",
      "Cryptographie",
      "Géométrie Topologie Algèbre",
      "Dynamique et Géométrie Complexe"
    ],
    "answer": 1,
    "explain": "Les 6 équipes de l'IMT sont : Analyse, Dynamique et Géométrie Complexe, Équations aux Dérivées Partielles, Géométrie Topologie Algèbre, Probabilités, et Statistique et Optimisation.",
    "link": "https://www.math.univ-toulouse.fr/fr/recherche/teams/"
  },
  {
    "q": "Lequel de ces domaines ne fait pas partie des 8 thèmes transversaux de l'IMT ?",
    "options": [
      "Biologie et santé",
      "Finance et assurance",
      "Sciences humaines",
      "Astronomie"
    ],
    "answer": 3,
    "explain": "Les 8 thèmes transversaux sont : Biologie et santé, Finance et assurance, Industrie, Informatique, Modélisation et calcul scientifique, Physique, Sciences des données et traitement du signal, et Sciences humaines.",
    "link": "https://www.math.univ-toulouse.fr/fr/recherche/themes/"
  },
  {
    "q": "Jérôme Bolte et Edouard Pauwels, chercheurs associés à l'IMT, ont reçu le prix Lagrange en optimisation continue pour des travaux liés à…",
    "options": [
      "la cryptographie quantique",
      "la météorologie",
      "l'apprentissage profond (deep learning)",
      "la théorie des nœuds"
    ],
    "answer": 2,
    "explain": "Leur article de 2020 porte sur la différentiation automatique non lisse, au cœur de l'entraînement des réseaux de neurones. Le prix Lagrange, décerné tous les 3 ans par la SIAM et la Mathematical Optimization Society, leur a été remis en 2024.",
    "link": "https://www.math.univ-toulouse.fr/en/institut/actualites/b79a96e0-b563-44a2-9d80-17ac15cd0123/"
  },
  {
    "q": "Au séminaire Maths-Info de l'IMT, Erik Martin-Dorel a présenté une méthode pour prouver automatiquement qu'un polynôme est positif. Avec quel outil ?",
    "options": [
      "Excel",
      "Rocq, un assistant de preuve",
      "ChatGPT",
      "Scratch"
    ],
    "answer": 1,
    "explain": "Rocq (anciennement Coq) est un assistant de preuve : un logiciel qui vérifie, étape par étape, qu'une démonstration mathématique est correcte. L'exposé a eu lieu le 12 novembre 2026.",
    "link": "https://www.math.univ-toulouse.fr/fr/activites/evenements/seminaires/"
  }
];

const app = document.getElementById("app");
const bar = document.getElementById("bar");
let current = 0;
let score = 0;

function render() {
  const item = QUESTIONS[current];
  bar.style.width = (current / QUESTIONS.length * 100) + "%";
  app.innerHTML = `
    <div class="count">Question ${current + 1} / ${QUESTIONS.length}</div>
    <h2>${item.q}</h2>
    <div class="options">
      ${item.options.map((o, i) => `<button class="opt" data-i="${i}">${o}</button>`).join("")}
    </div>
    <div class="feedback" id="fb"></div>
    <div class="actions"><button class="btn" id="next" hidden>${current === QUESTIONS.length - 1 ? "Voir mon score" : "Question suivante →"}</button></div>
  `;
  app.querySelectorAll(".opt").forEach(btn => btn.addEventListener("click", () => choose(+btn.dataset.i)));
  document.getElementById("next").addEventListener("click", () => {
    current++;
    current < QUESTIONS.length ? render() : showResult();
  });
}

function choose(i) {
  const item = QUESTIONS[current];
  const buttons = app.querySelectorAll(".opt");
  buttons.forEach(b => b.disabled = true);
  buttons[item.answer].classList.add("correct");
  const good = i === item.answer;
  if (good) score++; else buttons[i].classList.add("wrong");
  const fb = document.getElementById("fb");
  fb.className = "feedback show " + (good ? "good" : "bad");
  fb.innerHTML = `<strong>${good ? "Bonne réponse !" : "Pas tout à fait…"}</strong>${item.explain} <a href="${item.link}" target="_blank" rel="noopener">En savoir plus</a>`;
  const next = document.getElementById("next");
  next.hidden = false;
  next.focus();
}

function showResult() {
  bar.style.width = "100%";
  const msgs = [
    "Il est temps d'aller faire un tour sur le site de l'IMT !",
    "Un bon début : le site de l'IMT vous en apprendra plus.",
    "Pas mal du tout !",
    "Très bien, vous connaissez bien l'IMT.",
    "Excellent, presque un sans-faute !",
    "Sans-faute ! Vous êtes incollable sur l'IMT."
  ];
  app.innerHTML = `
    <div class="result">
      <div class="count">Votre score</div>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <p>${msgs[score]}</p>
      <div class="actions">
        <button class="btn secondary" id="again">Recommencer</button>
        <a class="btn" href="https://www.math.univ-toulouse.fr/fr/" target="_blank" rel="noopener" style="text-decoration:none">Découvrir l'IMT</a>
      </div>
    </div>
  `;
  document.getElementById("again").addEventListener("click", () => { current = 0; score = 0; render(); });
}

render();
</script>
</body>
</html>
